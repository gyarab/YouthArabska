<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Youth Arabská</title>
  <!-- GitHub Pages SPA Routing Fix (rafgraph/spa-github-pages) -->
  <script>
    var segmentCount = window.location.hostname.endsWith('.github.io') ? 1 : 0;
    var l = window.location;
    sessionStorage.redirect = l.href;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/')
    );
  </script>
</head>
<body></body>
</html>
